<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="robots" content="noindex">
<title>Entrar no painel — Maracanaú News</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="adm" data-page="adm-login">

<main class="adm-login">
  <div class="adm-login-card">
    <div class="logo">
      <span class="logo-ring"><span>MN</span></span>
      <span class="logo-name"><b>Maracanaú News</b><small>Painel da redação</small></span>
    </div>

    <h1>Entrar no painel</h1>
    <p>Acesso restrito à equipe. Aqui você publica notícias no site.</p>

    <form id="formLogin">
      <div class="field">
        <label for="senha">Senha do painel</label>
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required>
        <div class="hint">Senha inicial: <b>maracanau2026</b>. Troque no painel master depois do primeiro acesso.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block"><span data-icon="lock"></span> Entrar</button>
    </form>

    <a class="btn btn-ghost btn-block" style="margin-top:12px;" href="../index.html"><span data-icon="back"></span> Voltar ao site</a>
  </div>
</main>

<script src="../script.js"></script>
</body>
</html>
